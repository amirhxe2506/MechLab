name: Django Backend CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/django.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend/**"
      - ".github/workflows/django.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mechlab_test
          POSTGRES_USER: mechlab
          POSTGRES_PASSWORD: mechlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mechlab -d mechlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://mechlab:mechlab@localhost:5432/mechlab_test
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run calculation-engine tests
        working-directory: backend
        run: pytest tests/ -v

      - name: Run Django tests
        working-directory: backend
        run: pytest core accounts learning calculators workspace api -v
